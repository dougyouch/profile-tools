AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'coverage/**/*'

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

Metrics/MethodLength:
  Max: 15

# Style preferences
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

Layout/LineLength:
  Max: 130
  Exclude:
    - 'spec/**/*'

# File naming - allow hyphenated gem name
Naming/FileName:
  Exclude:
    - 'lib/profile-tools.rb'
    - 'spec/profile-tools_spec.rb'
